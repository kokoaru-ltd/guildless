[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "guildless"
version = "0.1.0"
description = "Local-first AI company operating system with auditable council and approval gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "faster-whisper==1.2.1",
  "httpx>=0.27,<1",
  "langgraph==1.2.9",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
council = "council.cli:main"
guildless = "council.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["council"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
